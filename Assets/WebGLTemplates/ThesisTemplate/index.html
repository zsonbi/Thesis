<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>Unity WebGL Player | {{{ PRODUCT_NAME }}}</title>
<link rel="shortcut icon" href="TemplateData/favicon.ico">
<link rel="stylesheet" href="TemplateData/style.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
    touch-action: none;
    position: relative;
  }

  #unity-container {
    position: relative;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    z-index: 0;
  }

  canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
  }

  /* Hidden mobile inputs */
  #hidden-input, #hidden-textarea {
    position: fixed;
    top: -100px;
    opacity: 0;
    pointer-events: none;
    z-index: 9999;
  }
</style>
</head>
<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"></div>
    <div id="unity-footer">
      <div id="unity-webgl-logo"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">{{{ PRODUCT_NAME }}}</div>
    </div>
  </div>

  <!-- Hidden input fields for mobile keyboard -->
  <input id="hidden-input" type="text" />
  <textarea id="hidden-textarea"></textarea>

  <script>
    let unityInstance = null;
    const hiddenInput = document.getElementById('hidden-input');
    const hiddenTextarea = document.getElementById('hidden-textarea');
    let activeElement = null;

    // Called from Unity with TMP_InputField data in JSON
    function ShowMobileKeyboardAuto(jsonData) {
      const data = JSON.parse(jsonData);

      if (data.multiline) {
        activeElement = hiddenTextarea;
        hiddenInput.style.top = "-100px";
      } else {
        activeElement = hiddenInput;
        hiddenTextarea.style.top = "-100px";
        // Map Unity contentType to HTML input types
        if (data.contentType.includes("Integer") || data.contentType.includes("Decimal"))
          activeElement.type = "number";
        else if (data.contentType.includes("Password"))
          activeElement.type = "password";
        else
          activeElement.type = "text";
      }

      activeElement.value = data.text || "";
      activeElement.placeholder = data.placeholder || "";
      activeElement.style.top = "10px"; // bring into view for focus
      activeElement.focus();

      activeElement.oninput = () => {
        if (unityInstance)
          unityInstance.SendMessage('WebGLMobileKeyboardManager', 'OnKeyboardInput', activeElement.value);
      };
    }

    function HideMobileKeyboard() {
      if (activeElement) {
        activeElement.blur();
        activeElement.style.top = "-100px";
        activeElement = null;
      }
    }

    const originalfetch = fetch;
    fetch = function(url, data) {
      data = {...data, ...{credentials: "include"}};
      return originalfetch(url, data);
    };

    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var fullscreenButton = document.querySelector("#unity-fullscreen-button");
    var warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; padding: 10px;';
      else {
        if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(function() {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner: unityShowBanner,
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0,maximum-scale=1.0, user-scalable=no, shrink-to-fit=no';
      document.getElementsByTagName('head')[0].appendChild(meta);
      container.className = "unity-mobile";
      canvas.className = "unity-mobile";

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => {
          const canvas = document.getElementById('unity-canvas');
          canvas.style.height = window.visualViewport.height + 'px';
        });
      }
    } else {
      canvas.style.width = "{{{ WIDTH }}}px";
      canvas.style.height = "{{{ HEIGHT }}}px";
    }

#if BACKGROUND_FILENAME
    canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
    loadingBar.style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = 100 * progress + "%";
      }).then((instance) => {
        unityInstance = instance;
        loadingBar.style.display = "none";
        fullscreenButton.onclick = () => {
          unityInstance.SetFullscreen(1);
        };
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
